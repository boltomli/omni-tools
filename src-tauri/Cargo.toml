[package]
name = "OmniTools"
version = "0.1.0"
description = "Self-hosted collection of powerful web-based tools for everyday tasks."
authors = ["Ibrahima Gaye Coulibaly"]
license = "MIT"
repository = "https://github.com/boltomli/omnitools"
edition = "2024"
rust-version = "1.87.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
